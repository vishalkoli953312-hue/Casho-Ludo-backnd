<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Match Video Inspector & Admin</title>
<style>
:root{--ink:#120738;--card:#1d114a;--accent:#ffd23f}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:system-ui,-apple-system,sans-serif;background:#0d0626;color:#fff}
.wrap{max-width:800px;margin:0 auto}
h1{margin:0 0 4px;font-size:24px;color:var(--accent)}
p{color:#a99bde;font-size:13px;margin:0 0 20px}
.bar{display:flex;gap:10px;margin-bottom:20px}
input{flex:1;background:var(--card);border:2px solid #3c2a82;border-radius:12px;padding:12px 16px;color:#fff;font-size:15px;font-weight:700;outline:none}
input:focus{border-color:var(--accent)}
button{background:linear-gradient(#ffd23f,#ff9500);border:0;border-radius:12px;padding:12px 20px;font-weight:900;color:#3b1a00;cursor:pointer}
button:active{transform:scale(0.98)}
.btn-del{background:linear-gradient(#ff4757,#b3122a);color:#fff}
.card{background:var(--card);border:2px solid #3c2a82;border-radius:20px;padding:20px;display:none}
.card.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
video{width:100%;aspect-ratio:1;border-radius:14px;background:#000;border:2px solid #3c2a82}
.info-row{margin-bottom:12px}
.info-row b{display:block;color:var(--accent);font-size:12px;text-transform:uppercase}
.info-row span{font-size:14px;font-weight:700}
.players-box{background:#120738;border-radius:12px;padding:12px;margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap">
  <h1>🎮 Ludo Cash · Match Audit & Video Manager</h1>
  <p>Search any Match ID to inspect game canvas video and player logs.</p>

  <div class="bar">
    <input type="text" id="mid" placeholder="Enter Match ID (e.g. -NxAbc123...)">
    <button id="sbtn" onclick="fetchMatch()">Inspect Match</button>
  </div>

  <div id="result" class="card">
    <div class="grid">
      <div>
        <video id="vplayer" controls></video>
        <div style="margin-top:10px;font-size:12px;color:#a99bde">
          Format: <span id="vfmt">-</span> | Duration: <span id="vdur">-</span>s
        </div>
      </div>
      <div>
        <div class="info-row"><b>Match ID:</b><span id="d_mid">-</span></div>
        <div class="info-row"><b>Date & Time:</b><span id="d_time">-</span></div>
        <div class="info-row"><b>Firebase Match Status:</b><span id="d_fb_status">Checking...</span></div>
        <div class="info-row"><b>Players in Match:</b>
          <div class="players-box" id="d_players"></div>
        </div>
        <div style="margin-top:20px">
          <button class="btn-del" onclick="deleteVideo()">🗑 Delete Video from Cloudinary</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* NEW FIREBASE CONFIG FOR ADMIN */
var firebaseConfig = {
  apiKey: "AIzaSyBEK2Vd0izr1kfEm6uvB8b4sO8fn4qn97E",
  authDomain: "casho-ludo.firebaseapp.com",
  databaseURL: "https://casho-ludo-default-rtdb.firebaseio.com",
  projectId: "casho-ludo",
  storageBucket: "casho-ludo.firebasestorage.app",
  messagingSenderId: "404242176733",
  appId: "1:404242176733:web:124810d53d84201e4a5934",
  measurementId: "G-FGY3ZM5K8Q"
};

try {
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
} catch(e){}

var currentPublicId = null;

async function fetchMatch(){
  var id = document.getElementById('mid').value.trim();
  if(!id) return alert('कृपया Match ID दर्ज करें');
  
  var btn = document.getElementById('sbtn');
  btn.textContent = 'Searching…';
  
  // 1. Firebase से मैच विवरण चेक करना
  if(db){
    db.ref('matches/' + id).once('value', function(snapshot){
      var fbData = snapshot.val();
      if(fbData){
        document.getElementById('d_fb_status').textContent = '✅ Recorded in Firebase (' + (fbData.n1 || 'P1') + ' vs ' + (fbData.n2 || 'P2') + ')';
      } else {
        document.getElementById('d_fb_status').textContent = 'Firebase में रिकॉर्ड नहीं मिला';
      }
    });
  }

  // 2. Cloudinary से वीडियो व मेटाडेटा लोड करना
  try {
    var res = await fetch('/api/match?matchId=' + encodeURIComponent(id));
    var json = await res.json();
    
    if(!res.ok || !json.success){
      alert(json.error || 'Cloudinary पर मैच वीडियो नहीं मिला');
      document.getElementById('result').classList.remove('show');
      return;
    }
    
    var d = json.data;
    currentPublicId = d.public_id;
    
    document.getElementById('vplayer').src = d.url;
    document.getElementById('vfmt').textContent = d.format;
    document.getElementById('vdur').textContent = d.duration || 'N/A';
    document.getElementById('d_mid').textContent = d.metadata.matchId || id;
    document.getElementById('d_time').textContent = new Date(d.created_at).toLocaleString();
    
    var plHtml = '';
    try {
      var pl = JSON.parse(d.metadata.players || '[]');
      pl.forEach(function(p){
        plHtml += '<div style="margin-bottom:4px">🎨 <b>' + p.color.toUpperCase() + ':</b> ' + p.name + '</div>';
      });
    } catch(err){ plHtml = 'No Player Details Found'; }
    document.getElementById('d_players').innerHTML = plHtml;
    
    document.getElementById('result').classList.add('show');
  } catch(e){
    alert('नेटवर्क या सर्वर त्रुटि: ' + e.message);
  } finally {
    btn.textContent = 'Inspect Match';
  }
}

async function deleteVideo(){
  if(!currentPublicId) return;
  if(!confirm('क्या आप वाकई इस मैच का वीडियो Cloudinary से हमेशा के लिए डिलीट करना चाहते हैं?')) return;
  
  try {
    var res = await fetch('/api/match?publicId=' + encodeURIComponent(currentPublicId), { method: 'DELETE' });
    var json = await res.json();
    if(json.success){
      alert('वीडियो सफलतापूर्वक Cloudinary से हटा दिया गया है।');
      document.getElementById('result').classList.remove('show');
      document.getElementById('vplayer').src = '';
      currentPublicId = null;
    } else {
      alert('डिलीट करने में विफल: ' + json.error);
    }
  } catch(e){
    alert('डिलीट अनुरोध विफल: ' + e.message);
  }
}
</script>
</body>
</html>
