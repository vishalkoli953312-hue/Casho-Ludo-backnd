<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo 3D Arena · Admin Command Center</title>
<style>
:root{
  --bg-dark:#0a051d;--card-bg:#150d36;--border-col:#2e1f63;
  --accent:#f59e0b;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--txt:#f3f4f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg-dark);color:var(--txt);min-height:100vh}

/* Header */
header{background:#11092e;border-bottom:2px solid var(--border-col);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}
.brand{font-size:20px;font-weight:900;color:var(--accent);display:flex;align-items:center;gap:10px}
.live-indicator{display:flex;align-items:center;gap:8px;background:rgba(239,68,68,0.15);border:1px solid var(--red);padding:6px 14px;border-radius:20px;color:var(--red);font-size:12px;font-weight:800}
.dot-pulse{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:0.3;transform:scale(0.8)}}

/* Grid Layout */
.layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 65px)}
@media(max-width:980px){.layout{grid-template-columns:1fr;height:auto}}

/* Sidebar */
.sidebar{border-right:2px solid var(--border-col);background:#0d0726;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.tabs-bar{display:flex;gap:6px;background:var(--card-bg);padding:4px;border-radius:14px}
.tab-btn{flex:1;border:0;background:transparent;color:#9ca3af;padding:8px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer}
.tab-btn.active{background:var(--accent);color:#000}

.match-item{background:var(--card-bg);border:2px solid var(--border-col);border-radius:14px;padding:12px;cursor:pointer;transition:all 0.15s ease}
.match-item:hover,.match-item.active{border-color:var(--accent);transform:translateY(-2px);background:#1e144d}
.m-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:uppercase}
.b-live{background:rgba(239,68,68,0.2);color:var(--red)}
.b-fin{background:rgba(16,185,129,0.2);color:var(--green)}
.b-bot{background:rgba(124,58,237,0.2);color:#a78bfa}

/* Content Area */
.content{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1150px){.grid-2{grid-template-columns:1fr}}

.panel{background:var(--card-bg);border:2px solid var(--border-col);border-radius:20px;padding:18px}
.panel h3{font-size:16px;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}

/* Video Stage */
.video-stage{aspect-ratio:1;max-height:430px;background:#000;border-radius:14px;overflow:hidden;border:2px solid var(--border-col);display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain}

/* Telemetry Move Stream */
.event-stream{height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px}
.feed-row{background:#0b0621;border:1px solid var(--border-col);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:10px}
.feed-row.roll{border-left:4px solid var(--accent)}
.feed-row.move{border-left:4px solid var(--blue)}
.feed-row.cut{border-left:4px solid var(--red);background:#23081b}
.feed-time{margin-left:auto;font-size:11px;color:#9ca3af}

/* Delete Button */
.btn-del{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;width:100%;margin-top:14px;box-shadow:0 4px 14px rgba(239,68,68,0.3)}
.btn-del:active{transform:scale(0.98)}

.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<header>
  <div class="brand">
    <svg class="icon" style="color:var(--accent)" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span>LUDO 3D · AUDIT COMMAND CENTER</span>
  </div>
  <div class="live-indicator">
    <span class="dot-pulse"></span>
    <span>REALTIME SYNC ON</span>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="filterMatches('all')">All</button>
      <button class="tab-btn" onclick="filterMatches('pvp')">Online PvP</button>
      <button class="tab-btn" onclick="filterMatches('bot')">Vs Robot</button>
    </div>
    <div id="matchListContainer" style="display:flex;flex-direction:column;gap:8px">
      <div style="text-align:center;color:#9ca3af;padding:24px">Loading match sessions…</div>
    </div>
  </aside>

  <!-- Content -->
  <main class="content" id="contentArea">
    <div style="text-align:center;padding:80px 20px;color:#9ca3af">
      <svg class="icon" style="width:48px;height:48px;margin-bottom:12px;color:var(--accent)" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <h2>Select a Match to Inspect</h2>
      <p style="font-size:14px;margin-top:6px">Click any match session from the left sidebar to inspect live moves, recording stream, and player telemetry.</p>
    </div>
  </main>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBEK2Vd0izr1kfEm6uvB8b4sO8fn4qn97E",
  authDomain: "casho-ludo.firebaseapp.com",
  databaseURL: "https://casho-ludo-default-rtdb.firebaseio.com",
  projectId: "casho-ludo",
  storageBucket: "casho-ludo.firebasestorage.app",
  messagingSenderId: "404242176733",
  appId: "1:404242176733:web:124810d53d84201e4a5934",
  measurementId: "G-FGY3ZM5K8Q"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var matchesData = {};
var activeId = null;
var currentTab = 'all';

db.ref('matches').on('value', function(snapshot){
  matchesData = snapshot.val() || {};
  renderList();
  if(activeId && matchesData[activeId]){
    inspectMatch(activeId);
  }
});

function filterMatches(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  renderList();
}

function renderList(){
  var container = document.getElementById('matchListContainer');
  var keys = Object.keys(matchesData).reverse();

  if(!keys.length){
    container.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:24px">No games recorded yet.</div>';
    return;
  }

  var html = '';
  keys.forEach(function(id){
    var m = matchesData[id];
    var isLive = (m.status === 'live');
    var isBot = (m.mode === 'bot');

    if(currentTab === 'pvp' && isBot) return;
    if(currentTab === 'bot' && !isBot) return;

    var statusBadge = isLive ? '<span class="m-badge b-live">LIVE</span>' : '<span class="m-badge b-fin">COMPLETED</span>';
    var modeBadge = isBot ? '<span class="m-badge b-bot">VS ROBOT</span>' : '';
    var activeClass = (id === activeId) ? 'active' : '';

    html += '<div class="match-item ' + activeClass + '" onclick="inspectMatch(\'' + id + '\')">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;color:#9ca3af">' +
        '<span>' + id.slice(0,14) + '</span>' +
        '<div>' + modeBadge + ' ' + statusBadge + '</div>' +
      '</div>' +
      '<div style="font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px">' +
        '<span>' + (m.n1 || 'Player 1') + '</span>' +
        '<span style="color:var(--accent);font-size:11px">VS</span>' +
        '<span>' + (m.n2 || 'Player 2') + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:#6b7280;margin-top:6px">' +
        new Date(m.start || Date.now()).toLocaleTimeString() +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}

function inspectMatch(id){
  activeId = id;
  renderList();
  var m = matchesData[id];
  if(!m) return;

  var isLive = (m.status === 'live');
  var isBot = (m.mode === 'bot');

  // Parse moves timeline
  var feedHtml = '';
  if(m.events){
    Object.keys(m.events).forEach(function(k){
      var ev = m.events[k];
      var timeStr = ev.time ? new Date(ev.time).toLocaleTimeString() : '';
      var pName = (ev.by === 'red') ? (m.n1 || 'Red') : (m.n2 || 'Yellow');

      if(ev.t === 'roll'){
        feedHtml += '<div class="feed-row roll">' +
          '<span><strong>' + pName + '</strong> rolled dice: <strong style="color:var(--accent)">[' + ev.d + ']</strong></span>' +
          '<span class="feed-time">' + timeStr + '</span>' +
        '</div>';
      } else if(ev.t === 'move'){
        var capNote = (ev.captured && ev.captured.length) ? ' <strong style="color:var(--red)">(CAPTURED ENEMY TOKEN!)</strong>' : '';
        var rowClass = (ev.captured && ev.captured.length) ? 'cut' : 'move';
        feedHtml += '<div class="feed-row ' + rowClass + '">' +
          '<span><strong>' + pName + '</strong> moved Token #' + (ev.token + 1) + ' (' + ev.from + ' ➜ ' + ev.to + ')' + capNote + '</span>' +
          '<span class="feed-time">' + timeStr + '</span>' +
        '</div>';
      }
    });
  } else {
    feedHtml = '<div style="color:#9ca3af;text-align:center;padding:24px">No moves logged yet.</div>';
  }

  // Media view
  var mediaBlock = '';
  if(m.recordingUrl){
    mediaBlock = '<div class="video-stage"><video src="' + m.recordingUrl + '" controls autoplay></video></div>';
  } else if(isLive){
    mediaBlock = '<div class="video-stage" style="flex-direction:column;gap:12px;padding:20px;text-align:center;color:#9ca3af">' +
      '<div class="live-indicator"><span class="dot-pulse"></span> MATCH IS CURRENTLY LIVE</div>' +
      '<p style="font-size:14px">Move logs are syncing to the telemetry stream on the right in real-time.</p>' +
    '</div>';
  } else {
    mediaBlock = '<div class="video-stage" style="color:#9ca3af">Video recording processing or unavailable.</div>';
  }

  document.getElementById('contentArea').innerHTML = '<div class="grid-2">' +
    '<div class="panel">' +
      '<h3>' + (isLive ? 'Live Match Screen' : 'Match Recording Video (Cloudinary)') + '</h3>' +
      mediaBlock +
      '<div style="margin-top:14px;font-size:13px;color:#9ca3af;display:flex;flex-direction:column;gap:4px">' +
        '<div>Match ID: <strong style="color:#fff">' + id + '</strong></div>' +
        '<div>Mode: <strong style="color:' + (isBot?'#a78bfa':'var(--green)') + '">' + (isBot?'Single Player vs Robot AI':'Online Multiplayer PvP') + '</strong></div>' +
        '<div>Status: <strong style="color:' + (isLive?'var(--red)':'var(--green)') + '">' + (isLive?'LIVE ACTIVE':'COMPLETED') + '</strong></div>' +
        (m.winner ? '<div>Winner: <strong style="color:var(--accent)">' + m.winner.toUpperCase() + '</strong></div>' : '') +
      '</div>' +
      '<button class="btn-del" onclick="deleteMatchPermanently(\'' + id + '\')">Delete Video & Match Record</button>' +
    '</div>' +

    '<div class="panel">' +
      '<h3>Realtime Move Telemetry Stream</h3>' +
      '<div class="event-stream">' + feedHtml + '</div>' +
    '</div>' +
  '</div>';
}

async function deleteMatchPermanently(id){
  if(!confirm("Permanently delete match data and Cloudinary video?")) return;
  var m = matchesData[id];
  if(m && m.publicId){
    try{ await fetch('/api/match?publicId=' + encodeURIComponent(m.publicId), { method:'DELETE' }); }catch(e){}
  }
  await db.ref('matches/' + id).remove();
  activeId = null;
  renderList();
  document.getElementById('contentArea').innerHTML = '<div style="text-align:center;padding:80px;color:var(--green)"><h2>Match Deleted Successfully</h2></div>';
}
</script>
</body>
</html>
