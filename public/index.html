<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ludo Cash Cartoon Arena</title>
<style>
:root{--ink:#2a1470;--gold:#ffd23f;--rad:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:"Comfortaa","Trebuchet MS",sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#8d4eff,#3a178e 55%,#1b074d)}

.screen{position:fixed;top:0;left:0;width:100vw;height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:70px 14px 14px;box-sizing:border-box;overflow-y:auto;z-index:5}
body[data-s="menu"] #menu{display:flex !important}
body[data-s="setup"] #setup{display:flex !important}
body[data-s="search"] #search{display:flex !important}
body[data-s="game"] #game{display:flex !important}

.screen>*{width:100%;max-width:440px;margin-left:auto;margin-right:auto}

/* Cartoon Styled Heading */
h1{margin:0 0 4px;text-align:center;font-size:44px;font-weight:900;letter-spacing:1px;text-shadow:0 6px 0 #b3122a,0 12px 0 #5b0a1a,0 16px 20px rgba(0,0,0,0.6);transform:rotate(-2deg)}
.sub{text-align:center;margin:0 0 10px;font-weight:900;font-size:14px;color:#ffde70;text-shadow:0 2px 4px rgba(0,0,0,0.5)}

/* Cartoon Card */
.card{background:#ffffff;color:var(--ink);border-radius:var(--rad);padding:16px;box-shadow:0 8px 0 #b9a8ef,0 16px 28px rgba(0,0,0,0.45);border:3px solid #fff;margin-bottom:12px;position:relative}
.card h3{margin:0 0 8px;font-size:16px;font-weight:900}
.chips{display:flex;gap:8px}.chips button{flex:1}
.chip{border:0;border-radius:16px;padding:12px 6px;font:900 16px inherit;color:var(--ink);background:#e4dcff;box-shadow:0 4px 0 #b9a8ef;cursor:pointer}
.chip.on{background:linear-gradient(#ffd23f,#ff9500);color:#fff;box-shadow:0 4px 0 #b45a00}

/* Bouncy Cartoon Buttons */
.btn{border:0;border-radius:22px;padding:14px 20px;font:900 20px inherit;color:#fff;background:linear-gradient(#ffd23f,#ff8a00);box-shadow:0 7px 0 #b45a00,0 14px 20px rgba(0,0,0,0.45);text-shadow:0 2px 0 #b45a00;position:relative;cursor:pointer;outline:none;transition:transform 0.1s}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #b45a00}
.btn.go{background:linear-gradient(#48ff70,#0ea336);box-shadow:0 7px 0 #076b22,0 14px 20px rgba(0,0,0,0.45);text-shadow:0 2px 0 #076b22}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:14px;box-shadow:0 4px 0 #b45a00}

/* Copy Match ID Pill */
.mid-badge{background:rgba(0,0,0,0.4);border:2px solid #ffde70;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mid-badge:active{background:#ffde70;color:#000}

/* Tokens */
.tok{cursor:pointer}
.can .in{animation:hop 0.4s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-10px) scale(1.18)}}
.in{transform-box:fill-box;transform-origin:center}
.ring{opacity:0}
.can .ring{opacity:1;stroke-dasharray:6 5}

/* 3D Cartoon Board Frame */
#bw{aspect-ratio:1;width:min(90vw,56vh,460px);height:min(90vw,56vh,460px);margin:0 auto;border-radius:28px;padding:6px;background:linear-gradient(135deg,#ffffff,#dcd0ff);box-shadow:0 10px 0 #573db5,0 20px 30px rgba(0,0,0,0.6);position:relative}
#game>.prow,#game>#top,#game>#say{width:min(90vw,56vh,460px);max-width:460px;margin:0 auto}
.prow{display:flex;gap:8px}
.pp{flex:1;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:18px;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.3);font-weight:900;font-size:12px}
.pp.turn{border-color:#ffd23f;background:rgba(255,255,255,0.4);box-shadow:0 0 16px #ffd23f}

/* Toast & Victory Modal */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1c1143;color:#fff;padding:16px 28px;border-radius:24px;font-weight:900;font-size:16px;border:3px solid var(--gold);box-shadow:0 12px 35px rgba(0,0,0,0.9);display:none;z-index:999999}
#toast.on{display:block !important}

#modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:99999;padding:16px}
#modal.on{display:flex !important}

#hdr{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:linear-gradient(#5b2bd6,#3b1a9c);box-shadow:0 4px 0 #1e0b5e}
.logo{font:900 22px inherit;text-shadow:0 2px 0 #b3122a}
.wal{background:linear-gradient(#ffd23f,#ff9500);color:#4a2000;border-radius:18px;padding:4px 12px;font-weight:900;box-shadow:0 3px 0 #b45a00}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body data-s="menu">

<header id="hdr">
  <span class="logo">🎲 LUDO CASH</span>
  <span class="wal">💰 <b id="wal">₹150</b></span>
</header>

<section id="menu" class="screen">
  <h1>LUDO</h1>
  <p class="sub">Roll. Capture. Win Cash!</p>
  <div class="card" style="text-align:center">
    <h3>⚡ Online Battle</h3>
    <p style="font-size:13px;font-weight:700;color:#61529e;margin:6px 0 12px">2 Players · Highest Score Wins Prize</p>
    <button class="btn go" id="onl" style="width:100%">Play Online (₹10)</button>
  </div>
  <div class="card" style="text-align:center">
    <h3>👥 Pass & Play</h3>
    <button class="btn" id="offl" style="width:100%">Offline Match</button>
  </div>
</section>

<section id="search" class="screen">
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
    <div style="font-size:56px">🔍</div>
    <h2>Finding Opponent…</h2>
    <p class="sub">Matching with a real player</p>
    <button class="btn sm" id="cancel">Cancel</button>
  </div>
</section>

<section id="game" class="screen">
  <div id="top" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span class="mid-badge" id="midBadge" onclick="copyMatchId()">📋 <span id="midText">Match ID</span></span>
    <span id="tmr" style="font-weight:900;background:rgba(0,0,0,0.4);padding:4px 10px;border-radius:14px">⏱ 10:00</span>
    <button class="btn sm" id="back">⌂ Menu</button>
  </div>

  <div class="prow" id="ptop"></div>
  <div id="bw"><svg id="svg" viewBox="0 0 600 600"></svg></div>
  <div class="prow" id="pbot"></div>

  <div id="say" style="text-align:center;font-weight:900;font-size:16px;min-height:22px;margin-top:4px">Tap Dice to Roll!</div>
  <div id="stash" hidden><div id="dice" style="width:52px;height:52px;cursor:pointer"></div></div>
</section>

<canvas id="recCanvas" width="480" height="480" style="display:none"></canvas>
<div id="toast"></div>

<div id="modal">
  <div class="card" style="text-align:center;max-width:360px">
    <h2 id="winTitle" style="font-size:28px">🏆 Victory!</h2>
    <div id="pod" style="margin:16px 0;font-size:20px;font-weight:900"></div>
    <button class="btn go" id="again" style="width:100%;margin-bottom:8px">Play Again</button>
  </div>
</div>

<script>
var $ = function(s){ return document.querySelector(s); };
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

var C=['red','green','yellow','blue'], HEX={red:'#ff3b4e',green:'#22c55e',yellow:'#ffc61a',blue:'#2e8bff'}, DK={red:'#a80f26',green:'#0b7a33',yellow:'#b98400',blue:'#1252b0'};
var START={red:0,green:13,yellow:26,blue:39}, SAFE=new Set([0,8,13,21,26,34,39,47]), S=40, FINISH=57;
var PATH=[];
[[1,6,5,6],[6,5,6,0],[7,0,8,0],[8,1,8,5],[9,6,14,6],[14,7,14,8],[13,8,9,8],[8,9,8,14],[7,14,6,14],[6,13,6,9],[5,8,0,8],[0,7,0,6]].forEach(function(arr){
  var a=arr[0],b=arr[1],c=arr[2],d=arr[3];
  var n=Math.max(Math.abs(c-a),Math.abs(d-b)), sx=Math.sign(c-a), sy=Math.sign(d-b);
  for(var i=0;i<=n;i++) PATH.push([a+sx*i, b+sy*i]);
});
var R5=[1,2,3,4,5], R5r=[13,12,11,10,9];
var HOME={red:R5.map(function(i){return[i,7]}),green:R5.map(function(i){return[7,i]}),yellow:R5r.map(function(i){return[i,7]}),blue:R5r.map(function(i){return[7,i]})};
var YARD={red:[0,0],green:[9,0],yellow:[9,9],blue:[0,9]}, SLOT=[[1.9,1.9],[4.1,1.9],[1.9,4.1],[4.1,4.1]];
var FIN={red:[6.8,7.5],green:[7.5,6.8],yellow:[8.2,7.5],blue:[7.5,8.2]};

var G=null, busy=false, tick=0, tokEl={}, currentMatchId=null;

/* Firebase Setup */
var firebaseConfig = {
  apiKey: "AIzaSyBEK2Vd0izr1kfEm6uvB8b4sO8fn4qn97E",
  authDomain: "casho-ludo.firebaseapp.com",
  databaseURL: "https://casho-ludo-default-rtdb.firebaseio.com",
  projectId: "casho-ludo",
  storageBucket: "casho-ludo.firebasestorage.app",
  messagingSenderId: "404242176733",
  appId: "1:404242176733:web:124810d53d84201e4a5934",
  measurementId: "G-FGY3ZM5K8Q"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var uid = localStorage.uid || (localStorage.uid = 'u' + Math.random().toString(36).slice(2,9));
var ME = { n: 'Player ' + Math.floor(1000 + Math.random()*9000), a: '🦊' };
var my = 'red', mref = null, ON = false, tmr = null, q = Promise.resolve();

function show(s){ document.body.dataset.s = s; }
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 1400); }

function copyMatchId(){
  if(!currentMatchId) return;
  navigator.clipboard.writeText(currentMatchId);
  toast('Match ID Copied! 📋');
}

/* Sound */
function ding(){ try{ var a=new AudioContext(),o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=580; g.gain.value=0.1; o.start(); o.stop(a.currentTime+0.1); }catch(e){} }

/* Cartoon Board Rendering */
function drawBoard(){
  var h = '<defs>' + C.map(function(c){
    return '<radialGradient id="g'+c+'" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="'+HEX[c]+'"/><stop offset="1" stop-color="'+DK[c]+'"/></radialGradient>';
  }).join('') + '</defs>';

  C.forEach(function(c){
    var x = YARD[c][0], y = YARD[c][1];
    h += '<rect x="'+(x*S+2)+'" y="'+(y*S+2)+'" width="'+(6*S-4)+'" height="'+(6*S-4)+'" rx="24" fill="'+HEX[c]+'" stroke="'+DK[c]+'" stroke-width="5"/><rect x="'+((x+1)*S)+'" y="'+((y+1)*S)+'" width="'+(4*S)+'" height="'+(4*S)+'" rx="28" fill="#fff"/>';
    SLOT.forEach(function(sl){ h += '<circle cx="'+((x+sl[0])*S)+'" cy="'+((y+sl[1])*S)+'" r="'+(S*0.6)+'" fill="'+HEX[c]+'" opacity=".25"/>'; });
  });

  var cell = function(x,y,f){
    return '<rect x="'+(x*S+1.5)+'" y="'+(y*S+1.5)+'" width="'+(S-3)+'" height="'+(S-3)+'" rx="10" fill="'+f+'" stroke="#ffffffbb" stroke-width="2"/>';
  };

  PATH.forEach(function(pt, i){
    var sc = C.find(function(c){ return START[c] == i; });
    h += cell(pt[0], pt[1], sc ? HEX[sc] : '#ffffff');
    if(SAFE.has(i)) h += '<text x="'+((pt[0]+0.5)*S)+'" y="'+((pt[1]+0.52)*S)+'" text-anchor="middle" dominant-baseline="central" font-size="24" fill="'+(sc?'#fff':'#ff9500')+'">★</text>';
  });

  C.forEach(function(c){ HOME[c].forEach(function(pt){ h += cell(pt[0], pt[1], HEX[c]); }); });

  var m = 7.5*S;
  var P = function(a,b,c,d){ return (a*S)+','+(b*S)+' '+(c*S)+','+(d*S)+' '+m+','+m; };
  h += '<polygon points="'+P(6,6,6,9)+'" fill="'+HEX.red+'"/><polygon points="'+P(6,6,9,6)+'" fill="'+HEX.green+'"/><polygon points="'+P(9,6,9,9)+'" fill="'+HEX.yellow+'"/><polygon points="'+P(6,9,9,9)+'" fill="'+HEX.blue+'"/><circle cx="'+m+'" cy="'+m+'" r="10" fill="#fff"/><g id="tk"></g>';

  $('#svg').innerHTML = h;
  tokEl = {};
  var tk = $('#tk');

  C.forEach(function(c){
    tokEl[c] = [];
    for(var i=0; i<4; i++){
      var g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','tok');
      // Cartoon Tokens with Big Eyes
      g.innerHTML = '<circle r="26" fill="transparent"/><circle class="ring" r="22" cy="-1" fill="none" stroke="#fff" stroke-width="4"/><ellipse cx="0" cy="14" rx="16" ry="6" fill="#0005"/><g class="in"><path d="M-14 13Q-14 19 0 19Q14 19 14 13Q14 8 6 3Q9 -2 7 -6L-7 -6Q-9 -2 -6 3Q-14 8 -14 13Z" fill="url(#g'+c+')" stroke="'+DK[c]+'" stroke-width="3"/><circle cx="0" cy="-12" r="11" fill="url(#g'+c+')" stroke="'+DK[c]+'" stroke-width="3"/><circle cx="-3" cy="-14" r="3" fill="#fff"/><circle cx="3" cy="-14" r="3" fill="#fff"/><circle cx="-3" cy="-14" r="1.5" fill="#000"/><circle cx="3" cy="-14" r="1.5" fill="#000"/></g>';
      (function(col, idx){ g.onclick = function(){ tap(col, idx); }; })(c, i);
      tk.appendChild(g);
      tokEl[c].push(g);
    }
  });
}

function posOf(c,i,p){
  if(p==0) return [YARD[c][0]+SLOT[i][0], YARD[c][1]+SLOT[i][1]];
  if(p<=51) { var pt=PATH[(START[c]+p-1)%52]; return [pt[0]+0.5, pt[1]+0.5]; }
  if(p<57) { var hm=HOME[c][p-52]; return [hm[0]+0.5, hm[1]+0.5]; }
  return FIN[c];
}

function place(el,pos){ el.style.transform = 'translate('+(pos[0]*S)+'px,'+(pos[1]*S)+'px)'; }

function render(){
  if(!G) return;
  G.order.forEach(function(c){
    G.tokens[c].forEach(function(p, i){ place(tokEl[c][i], posOf(c, i, p)); });
  });

  var mv = (G.turn === my && G.dice != null) ? movable() : [];
  C.forEach(function(c){
    tokEl[c].forEach(function(e, i){
      e.classList.toggle('can', G.turn===c && c===my && mv.indexOf(i)!==-1);
    });
  });

  $('#ptop').innerHTML = '<div class="pp '+(G.turn==='red'?'turn':'')+'">🔴 ' + G.players[0].name + ' (⭐ ' + G.score.red + ')</div>';
  $('#pbot').innerHTML = '<div class="pp '+(G.turn==='yellow'?'turn':'')+'">🟡 ' + G.players[1].name + ' (⭐ ' + G.score.yellow + ')</div>';
  $('#dice').textContent = G.dice ? G.dice : '🎲';
  $('#say').textContent = (G.turn === my) ? (G.dice ? 'अपनी गोटी चुनें' : 'पासा फेंकें!') : 'विरोधी की चाल…';
}

function movable(){
  if(!G || G.dice==null) return [];
  var d = G.dice;
  return G.tokens[G.turn].map(function(p,i){ return (p==0 ? d==6 : p+d<=FINISH) ? i : -1; }).filter(function(i){ return i>=0; });
}

function doRoll(d){
  d = d || (Math.floor(Math.random()*6)+1);
  G.dice = d;
  ding();
  var mv = movable();
  if(!mv.length){ G.turn = (G.turn==='red'?'yellow':'red'); G.dice = null; }
  return { d: d, passed: !mv.length };
}

function doMove(i){
  var c = G.turn, d = G.dice, t = G.tokens[c], from = t[i], to = (from==0?1:from+d);
  t[i] = to;
  var cap = [];
  if(to<=51){
    var targetPos = (START[c]+to-1)%52;
    if(!SAFE.has(targetPos)){
      var opp = (c==='red'?'yellow':'red');
      G.tokens[opp].forEach(function(pos, idx){
        if(pos>=1 && pos<=51 && (START[opp]+pos-1)%52 === targetPos){ G.tokens[opp][idx] = 0; cap.push(opp); }
      });
    }
  }
  G.score[c] += (to === FINISH ? 50 : d) + cap.length*20;
  var extra = (d==6 || cap.length>0 || to===FINISH);
  if(extra){ G.dice = null; } else { G.turn = (G.turn==='red'?'yellow':'red'); G.dice = null; }
  return { color: c, token: i, from: from, to: to, cap: cap };
}

/* Tap & Roll Handlers */
$('#dice').onclick = function(){
  if(busy || !G || G.turn !== my || G.dice != null) return;
  var r = doRoll();
  // Telemetry event for admin
  if(mref) mref.child('events').push({ by: my, t: 'roll', d: r.d, time: Date.now() });
  render();
};

function tap(c, i){
  if(busy || !G || G.turn !== my || G.dice == null || movable().indexOf(i) === -1) return;
  var m = doMove(i);
  // Telemetry event for admin
  if(mref) mref.child('events').push({ by: my, t: 'move', i: i, from: m.from, to: m.to, cap: m.cap, time: Date.now() });
  render();
}

/* Host Recording Pipeline */
var recEngine = {
  recorder: null, blobs: [], active: false, timer: null,
  start: function(mid){
    var canvas = $('#recCanvas'), ctx = canvas.getContext('2d'), svg = $('#svg');
    this.active = true; this.blobs = [];
    this.timer = setInterval(function(){
      try{
        var xml = new XMLSerializer().serializeToString(svg);
        var img = new Image();
        img.onload = function(){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,480,480); ctx.drawImage(img,0,0,480,480); };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
      }catch(e){}
    }, 66);

    try{
      var stream = canvas.captureStream(15);
      this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm', videoBitsPerSecond: 250000 });
      var self = this;
      this.recorder.ondataavailable = function(e){ if(e.data.size>0) self.blobs.push(e.data); };
      this.recorder.onstop = function(){ self.upload(mid); };
      this.recorder.start(1000);
    }catch(e){}
  },
  stop: function(){ if(!this.active) return; this.active = false; clearInterval(this.timer); if(this.recorder) this.recorder.stop(); },
  upload: async function(mid){
    if(!this.blobs.length) return;
    toast('Cloudinary पर वीडियो भेजा जा रहा है…');
    var fd = new FormData();
    fd.append('video', new Blob(this.blobs,{type:'video/webm'}), 'match_'+mid+'.webm');
    fd.append('matchId', mid);
    try{
      var res = await fetch('/api/upload', { method:'POST', body:fd });
      var d = await res.json();
      if(d.success && mref){ mref.child('recordingUrl').set(d.secure_url); mref.child('publicId').set(d.public_id); }
    }catch(e){}
  }
};

/* Matchmaking */
$('#onl').onclick = async function(){
  show('search');
  var wr = db.ref('queue/waiting'), hit = null;
  await wr.transaction(function(c){
    if(c && c.uid !== uid && (Date.now() - c.t < 35000)){ hit = c; return null; }
    return { uid: uid, t: Date.now(), n: ME.n, a: ME.a };
  });

  if(hit){
    var mid = db.ref('matches').push().key;
    await db.ref('matches/' + mid).set({
      p1: hit.uid, p2: uid, n1: hit.n, n2: ME.n, a1: hit.a, a2: ME.a,
      start: Date.now(), status: 'live'
    });
    await db.ref('queue/matched/' + hit.uid).set(mid);
    startMatch(mid, 'yellow', hit.n);
  } else {
    db.ref('queue/matched/' + uid).on('value', function(x){
      if(x.val()){ db.ref('queue/matched/' + uid).off(); startMatch(x.val(), 'red', 'Opponent'); }
    });
  }
};

function startMatch(mid, col, oppName){
  currentMatchId = mid;
  $('#midText').textContent = mid.slice(0,8) + '…';
  my = col; mref = db.ref('matches/' + mid);
  G = {
    players: [{name: col==='red'?ME.n:oppName},{name: col==='yellow'?ME.n:oppName}],
    order: ['red','yellow'], tokens: {red:[0,0,0,0], yellow:[0,0,0,0]},
    turn: 'red', dice: null, score: {red:0, yellow:0}
  };
  show('game');
  drawBoard();
  render();

  if(my === 'red') recEngine.start(mid);

  mref.child('events').on('child_added', function(snap){
    var ev = snap.val();
    if(ev.by !== my){
      if(ev.t === 'roll') doRoll(ev.d);
      else if(ev.t === 'move') doMove(ev.i);
      render();
    }
  });

  mref.child('left').on('value', function(snap){
    if(snap.val() && snap.val() !== my){
      toast('विरोधी ने मैच छोड़ दिया! 🏆 आप जीत गए');
      if(my === 'red') recEngine.stop();
      mref.child('winner').set(my);
      show('menu');
    }
  });
  mref.child('left').onDisconnect().set(my);
}

$('#cancel').onclick = function(){ db.ref('queue/waiting').remove(); show('menu'); };
$('#back').onclick = function(){ if(confirm('मैच छोड़ना चाहते हैं?')){ if(mref) mref.child('left').set(my); if(my==='red') recEngine.stop(); show('menu'); } };
$('#again').onclick = function(){ show('menu'); };

drawBoard();
</script>
</body>
</html>
