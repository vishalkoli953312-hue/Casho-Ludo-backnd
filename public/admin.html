<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Super Admin & Live Radar</title>
<style>
:root{--bg:#0c061e;--panel:#170d38;--card:#221352;--neon:#00ffcc;--accent:#ffd000;--red:#ff3366}
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:2px solid #2d1b69}
.hdr h1{margin:0;font-size:22px;color:var(--neon);display:flex;align-items:center;gap:8px}

.live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:0.2}}

/* RESPONSIVE LAYOUT */
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* MATCH LIST PANEL */
.m-list{background:var(--panel);border-radius:18px;border:2px solid #2d1b69;padding:14px;max-height:85vh;overflow-y:auto}
.m-card{background:var(--card);border:2px solid #3c2482;border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:0.2s}
.m-card:hover,.m-card.active{border-color:var(--neon);background:#2c1969}
.m-card .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.badge{padding:3px 8px;border-radius:8px;font-weight:900;font-size:10px}
.badge.live{background:rgba(255,51,102,0.25);color:var(--red);border:1px solid var(--red)}
.badge.done{background:rgba(0,255,204,0.2);color:var(--neon);border:1px solid var(--neon)}

/* INSPECTION STAGE */
.stage{background:var(--panel);border-radius:18px;border:2px solid #2d1b69;padding:16px}
.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:650px){.stage-grid{grid-template-columns:1fr}}

video{width:100%;aspect-ratio:1;border-radius:14px;background:#000;border:2px solid #3c2482}

/* ACTION AUDIT LOG BOX */
.log-box{background:#0d0524;border-radius:14px;border:2px solid #2a1563;padding:12px;height:240px;overflow-y:auto;font-family:monospace;font-size:12px}
.log-row{padding:4px 0;border-bottom:1px solid #1c0e42;color:#bca9ff}
.log-row span{color:var(--accent);font-weight:700}

.btn-del{background:linear-gradient(180deg,#ff4757,#b3122a);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer;width:100%}
.btn-term{background:#ff9900;color:#000;border:0;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer;width:100%;margin-top:8px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div class="hdr">
  <h1><div class="live-dot"></div> LUDO RADAR · SUPER ADMIN</h1>
  <span style="font-size:12px;color:#a392e6">Live Cloud Sync</span>
</div>

<div class="layout">
  <!-- LEFT: REALTIME MATCH FEED -->
  <div class="m-list">
    <div style="font-weight:900;font-size:14px;margin-bottom:12px;color:var(--accent)">
      ⚡ REALTIME MATCH FEED
    </div>
    <div id="cards-container">
      <div style="font-size:13px;color:#8775c7;text-align:center;padding:20px">Searching for matches...</div>
    </div>
  </div>

  <!-- RIGHT: LIVE INSPECTOR & AUDIT LOG -->
  <div class="stage" id="stage-panel" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div>
        <h2 id="stg-title" style="margin:0;font-size:18px;color:var(--neon)">Match Inspector</h2>
        <span id="stg-mid" style="font-size:11px;color:#8f7ec7">ID: -</span>
      </div>
      <span id="stg-badge" class="badge">STATUS</span>
    </div>

    <div class="stage-grid">
      <!-- VIDEO STREAM / LIVE MIRROR -->
      <div>
        <video id="stg-video" controls autoplay></video>
        <div id="vid-status" style="font-size:12px;color:#bca9ff;margin-top:6px;text-align:center"></div>
      </div>

      <!-- AUDIT LOG & ACTION CONTROLS -->
      <div>
        <div style="font-weight:700;font-size:13px;margin-bottom:6px;color:var(--accent)">
          📜 TURN-BY-TURN MOVE HISTORY (LIVE):
        </div>
        <div class="log-box" id="stg-logs"></div>

        <div style="margin-top:14px">
          <button class="btn-del" onclick="deleteVideo()">🗑 Delete Video from Cloudinary</button>
          <button class="btn-term" onclick="terminateMatch()">⛔ Force Terminate Match</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* FIREBASE INIT */
var firebaseConfig = {
  apiKey: "AIzaSyBEK2Vd0izr1kfEm6uvB8b4sO8fn4qn97E",
  authDomain: "casho-ludo.firebaseapp.com",
  databaseURL: "https://casho-ludo-default-rtdb.firebaseio.com",
  projectId: "casho-ludo",
  storageBucket: "casho-ludo.firebasestorage.app",
  messagingSenderId: "404242176733",
  appId: "1:404242176733:web:124810d53d84201e4a5934",
  measurementId: "G-FGY3ZM5K8Q"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var selectedMatchId = null, currentPublicId = null;

/* REALTIME MATCH FEED LISTENER */
db.ref('matches').limitToLast(25).on('value', function(snapshot){
  var matches = snapshot.val();
  var container = document.getElementById('cards-container');
  if(!matches){ container.innerHTML = '<div style="text-align:center;color:#6b5a9e">No matches found.</div>'; return; }

  var html = '';
  var keys = Object.keys(matches).reverse(); // Latest matches on top
  keys.forEach(function(k){
    var m = matches[k];
    var isLive = (m.status === 'live');
    html += '<div class="m-card '+(selectedMatchId===k?'active':'')+'" onclick="inspect(\''+k+'\')">';
    html += '<div class="top"><span><b>' + (m.n1||'P1') + '</b> VS <b>' + (m.n2||'P2') + '</b></span>';
    html += '<span class="badge '+(isLive?'live':'done')+'">' + (isLive?'🔴 LIVE':'DONE') + '</span></div>';
    html += '<div style="font-size:11px;color:#8e7bc9">ID: ' + k.slice(0,12) + '...</div>';
    html += '</div>';
  });
  container.innerHTML = html;
});

/* INSPECT ANY MATCH */
function inspect(mid){
  selectedMatchId = mid;
  document.getElementById('stage-panel').style.display = 'block';
  document.getElementById('stg-mid').textContent = 'ID: ' + mid;

  db.ref('matches/' + mid).on('value', function(snapshot){
    var m = snapshot.val();
    if(!m) return;

    var isLive = (m.status === 'live');
    var badge = document.getElementById('stg-badge');
    badge.textContent = isLive ? '🔴 LIVE PLAY' : '✅ COMPLETED';
    badge.className = 'badge ' + (isLive ? 'live' : 'done');

    // वीडियो स्ट्रीम या रिकॉर्डिंग लोड करना
    var video = document.getElementById('stg-video');
    var vStat = document.getElementById('vid-status');

    if(m.recordingUrl){
      video.src = m.recordingUrl;
      video.style.display = 'block';
      vStat.textContent = "✅ Cloudinary Video Loaded Successfully";
      currentPublicId = "match_" + mid;
    } else if(isLive){
      video.src = "";
      vStat.textContent = "🔴 Match is currently in progress. Moves streaming live below...";
    } else {
      vStat.textContent = "⚠️ Video not yet available or forfeited";
    }

    // टर्न-बाय-टर्न एक्शन हिस्ट्री लोड करना
    var logBox = document.getElementById('stg-logs');
    logBox.innerHTML = '';
    if(m.logs){
      Object.keys(m.logs).forEach(function(lk){
        var row = m.logs[lk];
        var d = new Date(row.t).toLocaleTimeString();
        logBox.innerHTML += '<div class="log-row"><span>['+d+']</span> ' + row.msg + '</div>';
      });
      logBox.scrollTop = logBox.scrollHeight;
    } else {
      logBox.innerHTML = '<div style="color:#6b5a9e;padding:8px">Waiting for game moves...</div>';
    }
  });
}

/* ADMIN ACTIONS */
async function deleteVideo(){
  if(!currentPublicId) return alert("No video loaded");
  if(!confirm("Cloudinary से यह वीडियो हमेशा के लिए हटाएं?")) return;
  try {
    var res = await fetch('/api/match?publicId=' + encodeURIComponent(currentPublicId), { method: 'DELETE' });
    var json = await res.json();
    if(json.success){
      alert("वीडियो सफलतापूर्वक डिलीट हो गया!");
      document.getElementById('stg-video').src = '';
    }
  }catch(e){ alert("Error: " + e.message); }
}

function terminateMatch(){
  if(!selectedMatchId) return;
  if(!confirm("क्या आप वाकई इस मैच को जबरन रद्द (Terminate) करना चाहते हैं?")) return;
  db.ref('matches/' + selectedMatchId).update({
    status: 'terminated',
    left: 'admin_forced'
  });
  alert("मैच टर्मिनेट कर दिया गया!");
}
</script>
</body>
</html>
