<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ludo Super Cartoon Cash</title>
<style>
:root{--ink:#1e0d4a;--yellow:#ffd000;--red:#ff3355;--green:#10d65b;--blue:#0099ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 10%,#8744ff,#341578 50%,#150638);user-select:none}

/* CARTOON POP SCREENS */
.screen{position:fixed;top:0;left:0;width:100vw;height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:70px 14px 14px;box-sizing:border-box;overflow-y:auto;z-index:5}
body[data-s="menu"] #menu{display:flex !important}
body[data-s="setup"] #setup{display:flex !important}
body[data-s="search"] #search{display:flex !important}
body[data-s="game"] #game{display:flex !important}
.screen>*{width:100%;max-width:440px;margin:0 auto}

/* HEADER WITH MATCH ID BANNER */
#hdr{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:linear-gradient(180deg,#6b2cf5,#4411b0);box-shadow:0 5px 0 #210363;border-bottom:2px solid #a375ff}
.logo{font:900 24px inherit;letter-spacing:1px;text-shadow:0 3px 0 #ff0055,0 5px 0 #3a0013;display:flex;align-items:center;gap:6px}
.wal{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#ffd83b,#ff8800);color:#471f00;border-radius:20px;padding:4px 14px;font-weight:900;border:2px solid #fff;box-shadow:0 4px 0 #9c4b00}
.wal b{font-size:18px}

/* LIVE MATCH ID DISPLAY (CLICK TO COPY) */
#mid-bar{background:rgba(0,0,0,0.45);border:2px dashed var(--yellow);padding:5px 12px;border-radius:14px;font-size:12px;font-weight:900;display:flex;align-items:center;gap:8px;cursor:pointer;margin:0 auto 4px}
#mid-bar:hover{background:rgba(255,208,0,0.2)}

/* CARTOON CHUNKY CARDS */
.card{background:#ffffff;color:var(--ink);border-radius:26px;padding:16px;box-shadow:0 8px 0 #b39bf5,0 16px 24px rgba(0,0,0,0.45);border:3px solid #fff;margin-bottom:12px;text-align:center}
.card h3{margin:0 0 8px;font-size:18px}
.btn{border:3px solid #fff;border-radius:24px;padding:14px;font:900 20px inherit;color:#fff;background:linear-gradient(180deg,#ffd83b,#ff7b00);box-shadow:0 6px 0 #a34700,0 12px 18px rgba(0,0,0,0.4);text-shadow:0 2px 0 #733200;cursor:pointer;outline:none;position:relative;display:block;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a34700}
.btn.go{background:linear-gradient(180deg,#38ef7d,#11998e);box-shadow:0 6px 0 #085a53;text-shadow:0 2px 0 #053b36}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:14px;box-shadow:0 3px 0 #a34700;display:inline-block;width:auto}

/* LUDO BOARD & TOKENS */
#bw{aspect-ratio:1;width:min(92vw,56vh,440px);height:min(92vw,56vh,440px);margin:0 auto;border-radius:28px;padding:6px;background:linear-gradient(#fff,#d9c8ff);box-shadow:0 10px 0 #5229aa,0 20px 30px rgba(0,0,0,0.6);border:4px solid #fff;position:relative;flex:none}
#bw svg{width:100%;height:100%;display:block}
.tok{cursor:pointer}
.can .in{animation:hop 0.4s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-10px) scale(1.22)}}
.tok.sel .ring{opacity:1 !important;stroke:#ffd000 !important;stroke-width:6 !important}

/* PLAYER PANELS */
.prow{display:flex;gap:8px;width:min(92vw,56vh,440px);margin:0 auto}
.pp{flex:1;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,0.18);border:3px solid rgba(255,255,255,0.3)}
.pp.turn{border-color:#ffd000;background:rgba(255,255,255,0.4);box-shadow:0 0 16px #ffd000;animation:pulse 0.8s infinite alternate}
@keyframes pulse{to{transform:scale(1.02)}}
.pp b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot{width:52px;height:52px;display:grid;place-items:center}

/* CARTOON 3D DICE */
#dice{width:50px;height:50px;perspective:300px;cursor:pointer}
#dice.ready{animation:shake 0.6s infinite alternate}
@keyframes shake{0%{transform:rotate(-6deg)}100%{transform:rotate(6deg)}}
#cube{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 0.75s cubic-bezier(.15,.7,.2,1)}
.f{position:absolute;inset:0;border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;background:linear-gradient(135deg,#ffffff,#dfd6fa);border:3px solid #8e78cf;backface-visibility:hidden}
.f i{margin:auto;width:9px;height:9px;border-radius:50%;background:#201140;opacity:0}
.f i.on{opacity:1}
.f.o i.on{background:#ff0055;width:12px;height:12px}

/* TOAST MESSAGE */
#toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:#1f074a;color:#fff;padding:12px 24px;border-radius:24px;font-weight:900;font-size:16px;border:3px solid var(--yellow);box-shadow:0 12px 30px rgba(0,0,0,0.9);display:none;z-index:99999}
#toast.on{display:block !important;animation:pop 0.3s cubic-bezier(.15,.7,.2,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0.7)}to{transform:translate(-50%,-50%) scale(1)}}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(10,2,30,0.88);display:none;align-items:center;justify-content:center;z-index:99999;padding:16px}
#modal.on{display:flex !important}
</style>

<script>
var $ = function(s){ return document.querySelector(s); };
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

/* FIREBASE CONFIG */
var firebaseConfig = {
  apiKey: "AIzaSyBEK2Vd0izr1kfEm6uvB8b4sO8fn4qn97E",
  authDomain: "casho-ludo.firebaseapp.com",
  databaseURL: "https://casho-ludo-default-rtdb.firebaseio.com",
  projectId: "casho-ludo",
  storageBucket: "casho-ludo.firebasestorage.app",
  messagingSenderId: "404242176733",
  appId: "1:404242176733:web:124810d53d84201e4a5934",
  measurementId: "G-FGY3ZM5K8Q"
};

var db;
try{ firebase.initializeApp(firebaseConfig); db = firebase.database(); }catch(e){}

var C=['red','green','yellow','blue'], HEX={red:'#ff3355',green:'#10d65b',yellow:'#ffd000',blue:'#0099ff'}, DK={red:'#9e001c',green:'#097532',yellow:'#8f7400',blue:'#004f87'};
var START={red:0,green:13,yellow:26,blue:39}, SAFE=new Set([0,8,13,21,26,34,39,47]), S=40, FINISH=57;
var PATH=[];
[[1,6,5,6],[6,5,6,0],[7,0,8,0],[8,1,8,5],[9,6,14,6],[14,7,14,8],[13,8,9,8],[8,9,8,14],[7,14,6,14],[6,13,6,9],[5,8,0,8],[0,7,0,6]].forEach(function(arr){
  var a=arr[0],b=arr[1],c=arr[2],d=arr[3];
  var n=Math.max(Math.abs(c-a),Math.abs(d-b)), sx=Math.sign(c-a), sy=Math.sign(d-b);
  for(var i=0;i<=n;i++) PATH.push([a+sx*i, b+sy*i]);
});
var R5=[1,2,3,4,5], R5r=[13,12,11,10,9];
var HOME={red:R5.map(function(i){return[i,7]}),green:R5.map(function(i){return[7,i]}),yellow:R5r.map(function(i){return[i,7]}),blue:R5r.map(function(i){return[7,i]})};
var YARD={red:[0,0],green:[9,0],yellow:[9,9],blue:[0,9]}, SLOT=[[1.9,1.9],[4.1,1.9],[1.9,4.1],[4.1,4.1]];
var FIN={red:[6.8,7.5],green:[7.5,6.8],yellow:[8.2,7.5],blue:[7.5,8.2]};

var G=null, busy=false, tick=0, tokEl={}, cfg=[], currentMatchId="Local";
var ON=false, my='red', mref=null, wallet=150, uid=localStorage.uid||('u'+Math.random().toString(36).slice(2,8));

/* AUDIO FX */
var AC; function au(){ if(!AC){ var Ctx=window.AudioContext||window.webkitAudioContext; if(Ctx) AC=new Ctx(); } return AC; }
function tone(f,d,t,v){ try{ var a=au(); if(!a)return; var o=a.createOscillator(), g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.15,a.currentTime); g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+d); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d); }catch(e){} }
var snd={
  roll: function(){ tone(300,0.1,'square'); },
  move: function(){ tone(600,0.08,'triangle'); },
  cut: function(){ tone(150,0.35,'sawtooth',0.3); },
  win: function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f,0.25,'sine',0.2); }, i*120); }); }
};

function copyMatchId(){
  if(navigator.clipboard && currentMatchId !== "Local"){
    navigator.clipboard.writeText(currentMatchId);
    toast("Match ID Copied! 📋", 1200);
  }
}

function toast(m, ms){
  var t=$('#toast'); t.textContent=m; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, ms||1200);
}

/* REALTIME ACTION LOGGER: LOGS TO FIREBASE FOR ADMIN */
function logAction(txt){
  if(mref){
    mref.child('logs').push({
      t: Date.now(),
      msg: txt,
      turn: G ? G.turn : ''
    });
  }
}

/* CARTOON BOARD SVG */
function drawBoard(){
  var h = '<defs>' + C.map(function(c){
    return '<radialGradient id="g'+c+'" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="'+HEX[c]+'"/><stop offset="1" stop-color="'+DK[c]+'"/></radialGradient>';
  }).join('') + '</defs>';

  C.forEach(function(c){
    var x = YARD[c][0], y = YARD[c][1];
    h += '<rect x="'+(x*S+3)+'" y="'+(y*S+3)+'" width="'+(6*S-6)+'" height="'+(6*S-6)+'" rx="26" fill="'+HEX[c]+'" stroke="'+DK[c]+'" stroke-width="5"/><rect x="'+((x+1)*S)+'" y="'+((y+1)*S)+'" width="'+(4*S)+'" height="'+(4*S)+'" rx="22" fill="#fff"/>';
    SLOT.forEach(function(sl){
      h += '<circle cx="'+((x+sl[0])*S)+'" cy="'+((y+sl[1])*S)+'" r="'+(S*0.6)+'" fill="'+HEX[c]+'" opacity=".35"/>';
    });
  });

  var cell = function(x,y,f){
    return '<rect x="'+(x*S+2)+'" y="'+(y*S+2)+'" width="'+(S-4)+'" height="'+(S-4)+'" rx="10" fill="'+f+'" stroke="#ffffffbb" stroke-width="2"/>';
  };
  PATH.forEach(function(pt, i){
    var sc = C.find(function(c){ return START[c] == i; });
    h += cell(pt[0], pt[1], sc ? HEX[sc] : '#ffffff');
    if(SAFE.has(i)) h += '<text x="'+((pt[0]+0.5)*S)+'" y="'+((pt[1]+0.55)*S)+'" text-anchor="middle" dominant-baseline="central" font-size="24" fill="'+(sc?'#fff':'#f59e0b')+'">★</text>';
  });

  C.forEach(function(c){
    HOME[c].forEach(function(pt){ h += cell(pt[0], pt[1], HEX[c]); });
  });

  var m = 7.5*S;
  var P = function(a,b,c,d){ return (a*S)+','+(b*S)+' '+(c*S)+','+(d*S)+' '+m+','+m; };
  h += '<polygon points="'+P(6,6,6,9)+'" fill="'+HEX.red+'"/><polygon points="'+P(6,6,9,6)+'" fill="'+HEX.green+'"/><polygon points="'+P(9,6,9,9)+'" fill="'+HEX.yellow+'"/><polygon points="'+P(6,9,9,9)+'" fill="'+HEX.blue+'"/><circle cx="'+m+'" cy="'+m+'" r="14" fill="#fff" stroke="#ffcc00" stroke-width="4"/><g id="tk"></g>';

  $('#svg').innerHTML = h;
  tokEl = {};
  var tk = $('#tk');

  C.forEach(function(c){
    tokEl[c] = [];
    for(var i=0; i<4; i++){
      var g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','tok');
      g.innerHTML = '<circle class="ring" r="23" fill="none" stroke="#fff" stroke-width="4" opacity="0"/><g class="in"><circle cx="0" cy="14" r="14" fill="#00000044"/><path d="M-13 12 Q-13 18 0 18 Q13 18 13 12 Q13 6 5 2 Q8 -2 6 -6 L-6 -6 Q-8 -2 -5 2 Q-13 6 -13 12Z" fill="url(#g'+c+')" stroke="'+DK[c]+'" stroke-width="2.5"/><circle cx="0" cy="-12" r="10" fill="url(#g'+c+')" stroke="'+DK[c]+'" stroke-width="2.5"/></g>';
      (function(col, idx){
        g.addEventListener('click', function(){ tap(col, idx); });
      })(c, i);
      tk.appendChild(g);
      tokEl[c].push(g);
    }
  });
}

function posOf(c,i,p){
  if(p==0) return [YARD[c][0]+SLOT[i][0], YARD[c][1]+SLOT[i][1]];
  if(p<=51) { var pt=PATH[(START[c]+p-1)%52]; return [pt[0]+0.5, pt[1]+0.5]; }
  if(p<57) { var hm=HOME[c][p-52]; return [hm[0]+0.5, hm[1]+0.5]; }
  return FIN[c];
}
function place(el,pos,k){ el.style.transform = 'translate('+(pos[0]*S)+'px,'+(pos[1]*S)+'px) scale('+(k||1)+')'; }

function render(){
  if(!G) return;
  var pl = (!G.over && (mine() || !ON));
  G.order.forEach(function(c){
    G.tokens[c].forEach(function(p, i){
      place(tokEl[c][i], posOf(c, i, p));
    });
  });

  var mv = pl ? movable() : [];
  C.forEach(function(c){
    tokEl[c].forEach(function(e, i){
      e.classList.toggle('can', pl && G.turn==c && mv.indexOf(i) !== -1);
    });
  });

  panels();
  if(G.dice != null) faceTo(G.dice, false);
}

/* 3D DICE LOGIC */
var PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
var FT={1:'',2:'rotateY(90deg)',3:'rotateX(90deg)',4:'rotateX(-90deg)',5:'rotateY(-90deg)',6:'rotateY(180deg)'};
var ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
$('#dice').innerHTML = '<div id="cube">' + [1,2,3,4,5,6].map(function(v){
  return '<div class="f '+(v==1?'o':'')+'" style="transform:'+FT[v]+' translateZ(25px)">' + Array.from({length:9}, function(_,i){
    return '<i class="'+(PIPS[v].indexOf(i)!==-1?'on':'')+'"></i>';
  }).join('') + '</div>';
}).join('') + '</div>';

function faceTo(v, anim){
  var c = $('#cube'), t = ROT[v];
  c.style.transition = anim ? 'transform 0.75s cubic-bezier(.15,.7,.2,1)' : 'none';
  c.style.transform = 'rotateX('+t[0]+'deg) rotateY('+t[1]+'deg)';
}

function buildPanels(){
  $('#stash').appendChild($('#dice'));
  var mk = function(row){
    return row.map(function(c){
      var p = G.players.find(function(x){ return x.color == c; });
      if(!p) return '<div class="pp" style="visibility:hidden"></div>';
      return '<div class="pp" id="pp-'+c+'" style="border-color:'+HEX[c]+'"><b>'+p.name+'</b><div class="slot" id="sl-'+c+'"></div></div>';
    }).join('');
  };
  $('#ptop').innerHTML = mk(['red','green']);
  $('#pbot').innerHTML = mk(['blue','yellow']);
}

function panels(){
  G.players.forEach(function(p){
    var e = $('#pp-'+p.color);
    if(e) e.classList.toggle('turn', p.color==G.turn && !G.over);
  });
  var sl = $('#sl-'+G.turn), d = $('#dice');
  if(sl && d.parentNode !== sl) sl.appendChild(d);
  d.classList.toggle('ready', !G.over && (mine() || !ON) && G.dice==null && !busy);
}

function movable(){
  if(!G || G.dice==null) return [];
  var d = G.dice;
  return G.tokens[G.turn].map(function(p,i){
    return (p==0 ? d==6 : p+d<=FINISH) ? i : -1;
  }).filter(function(i){ return i >= 0; });
}

function nextTurn(){
  G.dice = null; G.sixes = 0;
  var o = G.order, i = o.indexOf(G.turn);
  G.turn = o[(i+1)%o.length];
}

function doRoll(d){
  d = d || (1 + Math.floor(Math.random()*6));
  G.sixes = (d==6) ? G.sixes+1 : 0;
  G.dice = d;
  var f = (G.sixes == 3), mv = movable();
  var passed = (f || !mv.length);
  if(passed) nextTurn();
  return { d: d, passed: passed, f: f };
}

function doMove(i){
  var c = G.turn, d = G.dice, t = G.tokens[c], from = t[i], to = (from==0 ? 1 : from+d);
  t[i] = to;
  var cap = [], trackPos = (to>=1 && to<=51) ? (START[c]+to-1)%52 : null;
  if(trackPos !== null && !SAFE.has(trackPos)){
    G.order.forEach(function(o){
      if(o != c){
        G.tokens[o].forEach(function(q, j){
          var oPos = (q>=1 && q<=51) ? (START[o]+q-1)%52 : null;
          if(oPos === trackPos){ G.tokens[o][j] = 0; cap.push(o); }
        });
      }
    });
  }
  var extra = (d==6 || cap.length>0 || to==FINISH);
  if(t.every(function(p){ return p == FINISH; })){
    G.finished.push(c);
    G.over = true;
  } else if(extra){
    G.dice = null;
  } else {
    nextTurn();
  }
  return { color: c, token: i, from: from, to: to, cap: cap };
}

/* HOST LIVE RECORDING ENGINE */
var recEngine = {
  recorder: null, blobs: [], active: false, interval: null,
  start: function(matchId){
    if(this.active) return;
    this.active = true; this.blobs = [];
    var canvas = $('#recCanvas'), ctx = canvas.getContext('2d'), svg = $('#svg');
    this.interval = setInterval(function(){
      try {
        var xml = new XMLSerializer().serializeToString(svg);
        var img = new Image();
        img.onload = function(){
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 480, 480);
          ctx.drawImage(img, 0, 0, 480, 480);
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
      }catch(e){}
    }, 66); // 15 FPS

    var stream = canvas.captureStream(15);
    var mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm';
    try {
      this.recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 250000 });
      var self = this;
      this.recorder.ondataavailable = function(e){ if(e.data && e.data.size > 0) self.blobs.push(e.data); };
      this.recorder.onstop = function(){ self.upload(matchId); };
      this.recorder.start(1000);
    }catch(err){ console.error(err); }
  },
  stop: function(){
    if(!this.active) return;
    this.active = false;
    clearInterval(this.interval);
    if(this.recorder && this.recorder.state !== 'inactive') this.recorder.stop();
  },
  upload: async function(matchId){
    if(!this.blobs.length) return;
    toast('Cloudinary पर मैच सेव हो रहा है… ☁️', 2000);
    var fullBlob = new Blob(this.blobs, { type: 'video/webm' });
    var fd = new FormData();
    fd.append('video', fullBlob, 'match_' + matchId + '.webm');
    fd.append('matchId', matchId);
    fd.append('players', JSON.stringify(cfg));
    try {
      var res = await fetch('/api/upload', { method: 'POST', body: fd });
      var data = await res.json();
      if(data.success && mref){
        mref.child('recordingUrl').set(data.secure_url);
        mref.child('status').set('completed');
      }
    }catch(e){}
  }
};

/* GAME FLOW */
var mine = function(){ return !ON || G.turn == my; };
var send = function(e){ if(mref) mref.child('events').push(Object.assign({}, e, {by: my})); };

$('#dice').addEventListener('click', async function(){
  if(busy || !G || G.over || !mine() || G.dice != null) return;
  busy = true;
  var r = doRoll();
  if(ON) send({ t: 'roll', d: r.d });
  logAction("🎲 " + G.turn.toUpperCase() + " rolled a " + r.d);
  snd.roll();
  faceTo(r.d, true);
  await sleep(750);
  if(r.passed){
    toast(r.f ? 'Three 6s! Lost turn' : 'No moves');
    logAction("⏭️ " + G.turn.toUpperCase() + " had no moves");
    busy = false; render(); return;
  }
  var mv = movable();
  if(mv.length == 1){ busy = false; humanMove(mv[0]); return; }
  busy = false; render();
});

function tap(c, i){
  if(busy || !G || G.over || !mine() || G.turn != c || G.dice == null || movable().indexOf(i) === -1) return;
  humanMove(i);
}

async function humanMove(i){
  busy = true;
  if(ON) send({ t: 'move', i: i });
  var r = doMove(i);
  logAction("🏃 " + r.color.toUpperCase() + " moved token #" + (i+1) + " to step " + r.to);
  var el = tokEl[r.color][r.token];
  place(el, posOf(r.color, r.token, r.to));
  snd.move();
  if(r.cap.length){
    snd.cut(); toast("Cut Token! ✂️", 1000);
    logAction("✂️ " + r.color.toUpperCase() + " captured " + r.cap.join() + "'s token!");
  }
  await sleep(250);
  busy = false; render();
  if(G.over) win();
}

function win(){
  if(ON && my === 'red') recEngine.stop();
  snd.win();
  $('#m-tit').textContent = "🏆 Victory!";
  $('#pod').textContent = G.finished[0].toUpperCase() + " Won the Game!";
  $('#modal').classList.add('on');
  logAction("🏁 Match Finished! Winner: " + G.finished[0].toUpperCase());
}

/* MATCHMAKING & REALTIME LIFECYCLE */
async function findMatch(){
  if(!db) return alert("Firebase Not Connected");
  $('#search').style.display='flex'; $('#menu').style.display='none';
  var wr = db.ref('queue/waiting'), inbox = db.ref('queue/matched/' + uid);
  var hit = null;

  inbox.on('value', function(x){
    if(x.val()){ inbox.off(); inbox.remove(); begin(x.val(), 'red'); }
  });

  await wr.transaction(function(c){
    hit = null;
    if(c && c.uid !== uid && (Date.now() - c.t < 35000)){ hit = c; return null; }
    return { uid: uid, t: Date.now(), n: 'Player ' + Math.floor(Math.random()*900) };
  });

  if(hit){
    inbox.off();
    var id = db.ref('matches').push().key;
    await db.ref('matches/' + id).set({
      id: id, status: 'live', p1: hit.uid, p2: uid,
      n1: hit.n || 'Player 1', n2: 'Player 2',
      start: Date.now()
    });
    await db.ref('queue/matched/' + hit.uid).set(id);
    begin(id, 'yellow');
  }
}

async function begin(id, col){
  my = col; currentMatchId = id; ON = true;
  $('#dsp-mid').textContent = id.slice(0,8) + '...';
  mref = db.ref('matches/' + id);

  cfg = [{ color: 'red', name: (col=='red'?'You':'Opponent') }, { color: 'yellow', name: (col=='yellow'?'You':'Opponent') }];
  G = { players: cfg, order: ['red','yellow'], tokens: {red:[0,0,0,0],yellow:[0,0,0,0]}, turn: 'red', dice: null, sixes: 0, finished: [], over: false };

  $('#search').style.display='none'; document.body.dataset.s = 'game';
  drawBoard(); buildPanels(); render();

  if(my === 'red') recEngine.start(id);

  mref.child('events').on('child_added', function(x){
    var e = x.val();
    if(e.by !== my){
      if(e.t === 'roll'){ doRoll(e.d); faceTo(e.d, true); render(); }
      else if(e.t === 'move'){ var r=doMove(e.i); place(tokEl[r.color][r.token], posOf(r.color, r.token, r.to)); render(); if(G.over) win(); }
    }
  });

  // EMERGENCY DISCONNECT: IF OPPONENT LEAVES, FLUSH VIDEO IMMEDIATELY
  mref.child('left').onDisconnect().set(my);
  mref.child('left').on('value', function(x){
    var v = x.val();
    if(v && v !== my && G && !G.over){
      toast("खिलाड़ी मैच छोड़कर भाग गया! 🏃", 3000);
      logAction("⚠️ Player " + v + " abandoned the match!");
      G.over = true;
      if(my === 'red') recEngine.stop(); // तुरंत जो रिकॉर्ड हुआ वो अपलोड करें
      win();
    }
  });
}

$('#onl').onclick = findMatch;
$('#offl').onclick = function(){
  ON = false; currentMatchId = "OFFLINE_" + Date.now().toString().slice(-4);
  $('#dsp-mid').textContent = currentMatchId;
  cfg = [{ color: 'red', name: 'Player 1' }, { color: 'yellow', name: 'Player 2' }];
  G = { players: cfg, order: ['red','yellow'], tokens: {red:[0,0,0,0],yellow:[0,0,0,0]}, turn: 'red', dice: null, sixes: 0, finished: [], over: false };
  document.body.dataset.s = 'game'; drawBoard(); buildPanels(); render();
};
$('#cancel').onclick = function(){ location.reload(); };
$('#sback').onclick = function(){ location.reload(); };
$('#again').onclick = function(){ location.reload(); };
</script>
