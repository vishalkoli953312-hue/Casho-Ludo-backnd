<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo 3D Arena · Admin Broadcast Inspector</title>
<style>
:root{
  --bg:#09041a;--card:#140c30;--border:#291a58;
  --accent:#f59e0b;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--txt:#f3f4f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}

/* Main Broadcast Header */
header{background:#0e0624;border-bottom:2px solid var(--border);height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.brand{font-size:18px;font-weight:900;color:var(--accent);display:flex;align-items:center;gap:8px}
.sync-badge{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,0.15);border:1px solid var(--green);padding:4px 12px;border-radius:18px;color:var(--green);font-size:11px;font-weight:800}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:0.3}}

/* Desktop Cockpit Grid */
.cockpit{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 56px)}
@media(max-width:900px){.cockpit{grid-template-columns:1fr;height:auto;overflow-y:auto}}

/* Sidebar Sessions */
.sidebar{border-right:2px solid var(--border);background:#0b041e;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.tab-pills{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:12px;margin-bottom:6px}
.t-btn{flex:1;border:0;background:transparent;color:#9ca3af;padding:6px;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer}
.t-btn.active{background:var(--accent);color:#000}

.m-tile{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;transition:all 0.15s ease}
.m-tile:hover,.m-tile.active{border-color:var(--accent);background:#1d1144}
.badge{font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.b-live{background:rgba(239,68,68,0.25);color:var(--red)}
.b-fin{background:rgba(16,185,129,0.25);color:var(--green)}
.b-bot{background:rgba(124,58,237,0.25);color:#a78bfa}

/* Inspector Single-Screen Stage */
.stage{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;height:100%}
.broadcast-hud{display:grid;grid-template-columns:1fr 340px;gap:16px;height:100%}
@media(max-width:1050px){.broadcast-hud{grid-template-columns:1fr;height:auto;overflow-y:auto}}

/* Video Screen */
.screen-box{background:#000;border:2px solid var(--border);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.video-wrapper{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:#05020c}
video{width:100%;height:100%;max-height:480px;object-fit:contain}

/* TV Broadcast Ticker on Video */
.ticker-bar{background:linear-gradient(90deg,#190938,#0b041e);border-top:2px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800}
.ticker-tag{background:var(--accent);color:#000;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:900;margin-right:8px}

/* Side Telemetry HUD */
.hud-panel{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.h-title{font-size:14px;color:var(--accent);font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}

.match-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-pill{background:#0b041d;border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}
.stat-pill small{display:block;font-size:10px;color:#9ca3af;font-weight:700}
.stat-pill b{font-size:13px;color:#fff}

.vs-board{background:#0b041d;border:1.5px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.player-score-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900}

.btn-del{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:900;cursor:pointer;margin-top:10px}
.btn-del:active{transform:scale(0.98)}

.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<header>
  <div class="brand">
    <svg class="icon" style="color:var(--accent)" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span>LUDO BROADCAST INSPECTOR</span>
  </div>
  <div class="sync-badge">
    <span class="pulse"></span>
    <span>SINGLE-SCREEN HUD</span>
  </div>
</header>

<div class="cockpit">
  <!-- Sessions List -->
  <aside class="sidebar">
    <div class="tab-pills">
      <button class="t-btn active" onclick="setFilter('all')">All</button>
      <button class="t-btn" onclick="setFilter('pvp')">Online PvP</button>
      <button class="t-btn" onclick="setFilter('bot')">Vs Robot</button>
    </div>
    <div id="sessionsList" style="display:flex;flex-direction:column;gap:6px">
      <div style="text-align:center;color:#6b7280;padding:20px;font-size:12px">Loading matches…</div>
    </div>
  </aside>

  <!-- Inspector Stage -->
  <main class="stage" id="mainStage">
    <div style="margin:auto;text-align:center;color:#6b7280">
      <svg class="icon" style="width:42px;height:42px;color:var(--accent);margin-bottom:8px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <h3>Select a Match Session</h3>
      <p style="font-size:13px;margin-top:4px">Select any game session from the left to view the recording and unified telemetry.</p>
    </div>
  </main>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBEK2Vd0izr1kfEm6uvB8b4sO8fn4qn97E",
  authDomain: "casho-ludo.firebaseapp.com",
  databaseURL: "https://casho-ludo-default-rtdb.firebaseio.com",
  projectId: "casho-ludo",
  storageBucket: "casho-ludo.firebasestorage.app",
  messagingSenderId: "404242176733",
  appId: "1:404242176733:web:124810d53d84201e4a5934",
  measurementId: "G-FGY3ZM5K8Q"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var matchesData = {};
var currentActiveId = null;
var currentTab = 'all';

db.ref('matches').on('value', function(snapshot){
  matchesData = snapshot.val() || {};
  renderSidebar();
  if(currentActiveId && matchesData[currentActiveId]){
    inspectSession(currentActiveId);
  }
});

function setFilter(tab){
  currentTab = tab;
  document.querySelectorAll('.t-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  renderSidebar();
}

function renderSidebar(){
  var container = document.getElementById('sessionsList');
  var keys = Object.keys(matchesData).reverse();

  if(!keys.length){
    container.innerHTML = '<div style="text-align:center;color:#6b7280;padding:20px;font-size:12px">No sessions yet.</div>';
    return;
  }

  var html = '';
  keys.forEach(function(id){
    var m = matchesData[id];
    var isLive = (m.status === 'live');
    var isBot = (m.mode === 'bot');

    if(currentTab === 'pvp' && isBot) return;
    if(currentTab === 'bot' && !isBot) return;

    var badge = isLive ? '<span class="badge b-live">LIVE</span>' : '<span class="badge b-fin">COMPLETED</span>';
    var botBadge = isBot ? '<span class="badge b-bot">ROBOT</span>' : '';
    var activeClass = (id === currentActiveId) ? 'active' : '';

    html += '<div class="m-tile ' + activeClass + '" onclick="inspectSession(\'' + id + '\')">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:10px;color:#9ca3af">' +
        '<span>' + id.slice(0,12) + '</span>' +
        '<div>' + botBadge + ' ' + badge + '</div>' +
      '</div>' +
      '<div style="font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px">' +
        '<span>' + (m.n1 || 'P1') + '</span>' +
        '<span style="color:var(--accent);font-size:10px">VS</span>' +
        '<span>' + (m.n2 || 'P2') + '</span>' +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}

function inspectSession(id){
  currentActiveId = id;
  renderSidebar();
  var m = matchesData[id];
  if(!m) return;

  var isLive = (m.status === 'live');
  var isBot = (m.mode === 'bot');

  // Compute Last Action
  var lastActionText = "Game initialized";
  var totalMoves = 0;
  var totalCuts = 0;

  if(m.events){
    var evKeys = Object.keys(m.events);
    totalMoves = evKeys.length;
    var lastEv = m.events[evKeys[evKeys.length - 1]];

    if(lastEv.t === 'roll'){
      lastActionText = (lastEv.by.toUpperCase()) + " rolled dice: [" + lastEv.d + "]";
    } else if(lastEv.t === 'move'){
      lastActionText = (lastEv.by.toUpperCase()) + " moved token to step " + lastEv.to;
      if(lastEv.captured && lastEv.captured.length){
        lastActionText += " (CAPTURED ENEMY!)";
      }
    }

    evKeys.forEach(function(k){
      if(m.events[k].captured && m.events[k].captured.length) totalCuts++;
    });
  }

  // Media view
  var mediaBlock = '';
  if(m.recordingUrl){
    mediaBlock = '<video src="' + m.recordingUrl + '" controls autoplay></video>';
  } else if(isLive){
    mediaBlock = '<div style="text-align:center;padding:40px;color:#9ca3af">' +
      '<div style="font-size:13px;font-weight:900;color:var(--red);margin-bottom:6px">LIVE MATCH IN PROGRESS</div>' +
      '<p style="font-size:12px">Recording will automatically appear once the match is finished.</p>' +
    '</div>';
  } else {
    mediaBlock = '<div style="text-align:center;color:#6b7280;padding:40px">Video processing or unavailable.</div>';
  }

  document.getElementById('mainStage').innerHTML =
    '<div class="broadcast-hud">' +
      /* Left Video Screen + Ticker */
      '<div class="screen-box">' +
        '<div class="video-wrapper">' + mediaBlock + '</div>' +
        '<div class="ticker-bar">' +
          '<div style="display:flex;align-items:center">' +
            '<span class="ticker-tag">LIVE TICKER</span>' +
            '<span>' + lastActionText + '</span>' +
          '</div>' +
          '<div style="color:#9ca3af;font-size:11px">' + new Date(m.start || Date.now()).toLocaleTimeString() + '</div>' +
        '</div>' +
      '</div>' +

      /* Right Unified Stats HUD */
      '<div class="hud-panel">' +
        '<div>' +
          '<div class="h-title">' +
            '<span>MATCH OVERVIEW</span>' +
            '<span style="font-size:11px;color:'+(isLive?'var(--red)':'var(--green)')+'">'+(isLive?'ACTIVE':'COMPLETED')+'</span>' +
          '</div>' +

          '<div class="match-stats-grid">' +
            '<div class="stat-pill"><small>Session ID</small><b>' + id.slice(0,10) + '</b></div>' +
            '<div class="stat-pill"><small>Mode</small><b>' + (isBot?'Vs Robot':'Online PvP') + '</b></div>' +
            '<div class="stat-pill"><small>Total Moves</small><b>' + totalMoves + '</b></div>' +
            '<div class="stat-pill"><small>Captures</small><b>' + totalCuts + '</b></div>' +
          '</div>' +

          '<div class="vs-board">' +
            '<div class="player-score-row" style="color:var(--red)">' +
              '<span>' + (m.n1 || 'Player 1') + ' (RED)</span>' +
              '<span>Turn: ' + (m.turn === 'red' ? 'ACTIVE' : 'WAIT') + '</span>' +
            '</div>' +
            '<div class="player-score-row" style="color:var(--yellow)">' +
              '<span>' + (m.n2 || 'Player 2') + ' (YELLOW)</span>' +
              '<span>Turn: ' + (m.turn === 'yellow' ? 'ACTIVE' : 'WAIT') + '</span>' +
            '</div>' +
            (m.winner ? '<div style="margin-top:6px;font-size:12px;font-weight:900;color:var(--accent);text-align:center">WINNER: ' + m.winner.toUpperCase() + '</div>' : '') +
          '</div>' +
        '</div>' +

        '<button class="btn-del" onclick="deleteMatchSession(\'' + id + '\')">Delete Video & Match Record</button>' +
      '</div>' +
    '</div>';
}

async function deleteMatchSession(id){
  if(!confirm("Permanently delete match record and Cloudinary video?")) return;
  var m = matchesData[id];
  if(m && m.publicId){
    try{ await fetch('/api/match?publicId=' + encodeURIComponent(m.publicId), { method:'DELETE' }); }catch(e){}
  }
  await db.ref('matches/' + id).remove();
  currentActiveId = null;
  renderSidebar();
  document.getElementById('mainStage').innerHTML = '<div style="margin:auto;text-align:center;color:var(--green)"><h3>Session Deleted Successfully</h3></div>';
}
</script>
</body>
</html>
