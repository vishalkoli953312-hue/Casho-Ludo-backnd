<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Cash · Admin Live Video Dashboard</title>
<style>
:root{--ink:#120738;--card:#1d114a;--accent:#ffd23f;--glow:#5b2bd6}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:system-ui,-apple-system,sans-serif;background:#0d0626;color:#fff}
.wrap{max-width:1050px;margin:0 auto}
header{border-bottom:1px solid #2b1968;padding-bottom:12px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:22px;color:var(--accent)}
p{color:#a99bde;font-size:12px;margin:3px 0 0}

/* दो कॉलम लेआउट: बाएँ मैच लिस्ट, दाएँ मोबाइल स्क्रीन प्लेयर */
.main-grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
@media(max-width:820px){.main-grid{grid-template-columns:1fr}}

.panel{background:var(--card);border:2px solid #3c2a82;border-radius:18px;padding:16px}
.panel h2{margin:0 0 12px;font-size:16px;color:#ffd23f;display:flex;align-items:center;justify-content:space-between}

/* मैच लिस्ट कार्ड्स */
.match-list{max-height:560px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.match-item{background:#120738;border:1.5px solid #332070;border-radius:12px;padding:10px 12px;cursor:pointer;transition:all .2s;position:relative}
.match-item:hover,.match-item.active{border-color:var(--accent);background:#251361;transform:translateY(-1px)}
.match-item b{display:block;font-size:13px;color:#fff}
.match-item small{color:#a892ff;font-size:11px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:900;margin-top:4px}
.badge.ready{background:#12a63a;color:#fff}
.badge.wait{background:#555;color:#ccc}

/* 9:16 रियल मोबाइल स्क्रीन जैसा वीडियो फ्रेम */
.mobile-frame-wrapper{display:flex;flex-direction:column;align-items:center}
.mobile-phone{width:310px;height:550px;background:#000;border:10px solid #2b1968;border-radius:36px;box-shadow:0 12px 30px rgba(0,0,0,0.8);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;background:#000}
.no-video{text-align:center;color:#6b5aa6;padding:20px;font-size:13px;font-weight:700}

.btn-del{background:linear-gradient(#ff4757,#b3122a);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:12px;cursor:pointer;margin-top:14px;width:100%}
.btn-del:active{transform:scale(0.98)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📱 Ludo Cash · Live & Auto Match Inspector</h1>
      <p>Direct match videos with full mobile screen view & sound recording</p>
    </div>
  </header>

  <div class="main-grid">
    <!-- बाएँ: हालिया मैचों की ऑटो-लिस्ट -->
    <div class="panel">
      <h2>Recent Matches <button onclick="loadMatches()" style="background:#ffd23f;border:0;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:900;cursor:pointer">🔄 Refresh</button></h2>
      <div id="mlist" class="match-list">
        <div style="text-align:center;color:#8a7cb8;padding:20px;font-size:12px">मैच लोड हो रहे हैं…</div>
      </div>
    </div>

    <!-- दाएँ: 9:16 पोर्ट्रेट मोबाइल स्क्रीन वीडियो प्लेयर -->
    <div class="panel mobile-frame-wrapper">
      <div class="mobile-phone">
        <video id="vplayer" controls playsinline></video>
        <div id="phint" class="no-video">← बायीं लिस्ट से कोई भी मैच चुनें<br><small style="color:#8873c4">वीडियो मोबाइल स्क्रीन और साउंड के साथ चलेगा</small></div>
      </div>

      <div style="width:310px;margin-top:12px;font-size:12px">
        <div style="display:flex;justify-content:space-between;color:#a99bde">
          <span>Match: <b id="cur_id" style="color:#fff">-</b></span>
          <span>Status: <b id="cur_status" style="color:#ffd23f">-</b></span>
        </div>
        <button id="delbtn" class="btn-del" style="display:none" onclick="deleteVideo()">🗑 Delete Video from Cloudinary</button>
      </div>
    </div>
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBEK2Vd0izr1kfEm6uvB8b4sO8fn4qn97E",
  authDomain: "casho-ludo.firebaseapp.com",
  databaseURL: "https://casho-ludo-default-rtdb.firebaseio.com",
  projectId: "casho-ludo",
  storageBucket: "casho-ludo.firebasestorage.app",
  messagingSenderId: "404242176733",
  appId: "1:404242176733:web:124810d53d84201e4a5934",
  measurementId: "G-FGY3ZM5K8Q"
};

var db;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch(e){}

var activePublicId = null;

// पेज लोड होते ही Firebase से हाल के सारे मैच खुद लोड हो जाएँगे
function loadMatches(){
  if(!db) return;
  var listEl = document.getElementById('mlist');
  listEl.innerHTML = '<div style="text-align:center;color:#8a7cb8;padding:20px;font-size:12px">मैच खोज रहे हैं…</div>';

  db.ref('matches').limitToLast(15).once('value', function(snapshot){
    var data = snapshot.val();
    if(!data){
      listEl.innerHTML = '<div style="text-align:center;color:#8a7cb8;padding:20px;font-size:12px">कोई मैच नहीं मिला</div>';
      return;
    }

    var html = '';
    var keys = Object.keys(data).reverse(); // सबसे नया मैच सबसे ऊपर

    keys.forEach(function(k){
      var m = data[k];
      var p1 = m.n1 || 'Player 1';
      var p2 = m.n2 || 'Player 2';
      var hasVid = !!m.recordingUrl;

      html += '<div class="match-item" onclick="playMatch(\''+k+'\',\''+(m.recordingUrl||'')+'\')">' +
                '<b>' + p1 + ' vs ' + p2 + '</b>' +
                '<small>ID: ' + k + '</small><br>' +
                (hasVid ? '<span class="badge ready">📹 Video Available</span>' : '<span class="badge wait">⏳ In Progress / No Video</span>') +
              '</div>';
    });

    listEl.innerHTML = html;
  });
}

// किसी भी मैच पर क्लिक करते ही 1 सेकंड में वीडियो चलेगा
async function playMatch(id, recUrl){
  document.getElementById('cur_id').textContent = id.slice(0, 10) + '..';
  document.getElementById('cur_status').textContent = 'Loading…';
  activePublicId = 'ludo_matches/match_' + id;

  var vp = document.getElementById('vplayer');
  var hint = document.getElementById('phint');
  var del = document.getElementById('delbtn');

  // अगर Firebase में डायरेक्ट लिंक है:
  if(recUrl){
    vp.src = recUrl;
    vp.style.display = 'block';
    hint.style.display = 'none';
    del.style.display = 'block';
    document.getElementById('cur_status').textContent = 'Playing';
    vp.play();
    return;
  }

  // नहीं तो Cloudinary API से ढूँढें:
  try {
    var res = await fetch('/api/match?matchId=' + encodeURIComponent(id));
    var json = await res.json();
    if(json.success && json.data && json.data.url){
      vp.src = json.data.url;
      vp.style.display = 'block';
      hint.style.display = 'none';
      del.style.display = 'block';
      document.getElementById('cur_status').textContent = 'Playing';
      vp.play();
    } else {
      vp.style.display = 'none';
      hint.style.display = 'block';
      hint.innerHTML = '⚠️ इस मैच का वीडियो अभी प्रोसेस हो रहा है या उपलब्ध नहीं है।';
      del.style.display = 'none';
      document.getElementById('cur_status').textContent = 'No Video';
    }
  }catch(e){
    vp.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = 'लोड करने में विफल';
  }
}

async function deleteVideo(){
  if(!activePublicId) return;
  if(!confirm('क्या आप इस मैच का वीडियो Cloudinary से हमेशा के लिए डिलीट करना चाहते हैं?')) return;

  try {
    var res = await fetch('/api/match?publicId=' + encodeURIComponent(activePublicId), { method: 'DELETE' });
    var json = await res.json();
    if(json.success){
      alert('वीडियो Cloudinary से हटा दिया गया!');
      document.getElementById('vplayer').src = '';
      document.getElementById('vplayer').style.display = 'none';
      document.getElementById('phint').style.display = 'block';
      document.getElementById('phint').textContent = 'वीडियो हटा दिया गया';
      document.getElementById('delbtn').style.display = 'none';
      loadMatches();
    }
  }catch(e){
    alert('त्रुटि: ' + e.message);
  }
}

// पेज खुलते ही लिस्ट लोड करें
window.onload = loadMatches;
</script>
</body>
</html>
